<!DOCTYPE html>

<html>
  <head>
    <link rel="stylesheet" href="index.css">
    <!-- Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="color-scheme-inputs-container">
        <input type="color" id="seed-color"/>
        <select id="drop-down">
          <option value="Monochrome">Monochrome</option>
          <option value="Monochrome-dark">Monochrome-dark</option>
          <option value="Monochrome-light">Monochrome-light</option>
          <option value="Analogic">Analogic</option>
          <option value="Complement">Complement</option>
          <option value="Analogic-complement">Analogic-complement</option>
          <option value="Triad">Triad</option>
          <option value="Quad">Quad</option>
        </select>
        <button id="get-color-scheme-btn">Get Color Scheme</button>
      </div>
      <div class="color-scheme-container">
        <div class="color-one-container">
          <div id="color-one" class="color-one"></div>
          <p id="hex-one" class="hex" onclick="handleCopyClipboard(hexOneText)"></p>
        </div>
        <div class="color-two-container">
          <div id="color-two" class="color-two"></div>
          <p id="hex-two" class="hex" onclick="handleCopyClipboard(hexTwoText)"></p>
        </div>
        <div class="color-three-container">
          <div id="color-three" class="color-three"></div>
          <p id="hex-three" class="hex" onclick="handleCopyClipboard(hexThreeText)"></p>
        </div>
        <div class="color-four-container">
          <div id="color-four" class="color-four"></div>
          <p id="hex-four" class="hex" onclick="handleCopyClipboard(hexFourText)"></p>
        </div>
        <div class="color-five-container">
          <div id="color-five" class="color-five" onclick="handleCopyClipboard(hexFiveText)"></div>
          <p id="hex-five" class="hex"></p>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>

</html>
